- name: "Install net-tools and ifenslave for supporting bonding"
  apt:
    name: ['ifenslave', 'net-tools']
    state: present
    update_cache: true
  when: ansible_distribution_major_version | int >= 20

- name: "Install netplan.io and clout-init"
  apt:
    name: ['netplan.io', 'cloud-init']
    state: present
    update_cache: true
  when: ansible_distribution != "Ubuntu"

- name: "Add network renderer #1"
  lineinfile:
    path: /etc/cloud/cloud.cfg
    line: "   network:"
    create: yes
  when: ansible_distribution != "Ubuntu"

- name: "Add network renderer #2"
  lineinfile:
    path: /etc/cloud/cloud.cfg
    line: "     renderers: ['netplan', 'eni', 'sysconfig']"
    create: yes
  when: ansible_distribution != "Ubuntu"

- name: "Activate systemd-resolved service"
  systemd:
    state: started
    enabled: true
    name: systemd-resolved

# Same rationale as the EL firewalld handling: the platform scrapes 9100/tcp.
- name: Gather installed packages
  package_facts:

- name: Allow the node_exporter port through ufw
  community.general.ufw:
    rule: allow
    port: '9100'
    proto: tcp
  when: "'ufw' in ansible_facts.packages"
