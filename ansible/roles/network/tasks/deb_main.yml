- name: "Install net-tools"
  apt:
    name: ['net-tools']
    state: present
    update_cache: true

# Bonding is native to netplan/systemd-networkd; legacy ifupdown's networking.service
# fails under netplan on a broken if-up.d/resolved hook
# (https://bugs.launchpad.net/ubuntu/+source/ifupdown/+bug/1906226). ifenslave hard-depends
# on ifupdown, so keep the whole stack out.
- name: "Purge ifupdown stack (netplan is the renderer)"
  apt:
    name: ['ifenslave', 'ifupdown']
    state: absent
    purge: true

- name: "Activate systemd-resolved service"
  systemd:
    state: started
    enabled: true
    name: systemd-resolved

# Same rationale as the EL firewalld handling: the platform scrapes 9100/tcp.
- name: Gather installed packages
  package_facts:

- name: Allow the node_exporter port through ufw
  community.general.ufw:
    rule: allow
    port: '9100'
    proto: tcp
  when: "'ufw' in ansible_facts.packages"
