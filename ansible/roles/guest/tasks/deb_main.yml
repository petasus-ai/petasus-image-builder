---
- name: "Install guest agent"
  apt:
    name: ['qemu-guest-agent']
    state: present
    update_cache: true
  become: true

# Migrated customer images may force eth0-style NIC names; the platform addresses
# the default NIC by its predictable name (enp1s0), so strip the args.
- name: Find grub default drop-in configs
  find:
    paths: /etc/default/grub.d
    patterns: '*.cfg'
  register: grub_d_cfgs
  become: true

- name: Remove net.ifnames/biosdevname kernel args from grub defaults
  replace:
    path: "{{ item }}"
    regexp: ' ?(?:net\.ifnames|biosdevname)=[^ "]*'
    replace: ''
  loop: "{{ ['/etc/default/grub'] + (grub_d_cfgs.files | map(attribute='path') | list) }}"
  register: grub_defaults
  become: true

- name: Update grub when the kernel args changed
  command: update-grub
  when: grub_defaults is changed
  become: true
