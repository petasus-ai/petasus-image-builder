# Migrated/unregistered EL guests (e.g. RHEL without a subscription) may have no
# usable dnf repos. When el_repo_url points at an installation-media tree served
# over HTTP (containing BaseOS/ and AppStream/), the build installs from it;
# sysprep removes the repo file so shipped images carry no build-time URL.
- name: Provide installation-media dnf repos for the build
  copy:
    dest: /etc/yum.repos.d/petasus-build-media.repo
    content: |
      [petasus-build-baseos]
      name=Petasus build media - BaseOS
      baseurl={{ el_repo_url }}/BaseOS
      enabled=1
      gpgcheck=0

      [petasus-build-appstream]
      name=Petasus build media - AppStream
      baseurl={{ el_repo_url }}/AppStream
      enabled=1
      gpgcheck=0
  when: el_repo_url is defined and el_repo_url | length > 0

- block:
    - name: "Install guest agent"
      yum:
        name: "qemu-guest-agent"
        state: present
      become: true

    - name: Read /proc/cmdline
      command: cat /proc/cmdline
      register: cmdline
      changed_when: false

    - name: Check whether both options are already present
      set_fact:
        opts_present: "{{ ('net.ifnames=0' in cmdline.stdout) and ('biosdevname=0' in cmdline.stdout) }}"

    - name: Locate grubby (don't fail if not present)
      shell: "command -v grubby 2>/dev/null || true"
      register: grubby_path
      changed_when: false

    - name: Skip because options already present
      debug:
        msg: "net.ifnames=0 and biosdevname=0 already present in /proc/cmdline — skipping."
      when: opts_present

    - name: Skip because grubby not installed (informational)
      debug:
        msg: "grubby not found on this host; skipping kernel-arg update."
      when: not opts_present and (grubby_path.stdout == "")

    - name: Add kernel boot options using grubby (only when missing and grubby exists)
      command: "{{ grubby_path.stdout }} --update-kernel=ALL --args='net.ifnames=0 biosdevname=0'"
      register: grubby_result
      when: not opts_present and (grubby_path.stdout != "")
