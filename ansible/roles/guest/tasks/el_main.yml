# Migrated/unregistered EL guests (e.g. RHEL without a subscription) may have no
# usable dnf repos. When el_repo_url points at an installation-media tree served
# over HTTP (containing BaseOS/ and AppStream/), the build installs from it;
# sysprep removes the repo file so shipped images carry no build-time URL.
- name: Provide installation-media dnf repos for the build
  copy:
    dest: /etc/yum.repos.d/petasus-build-media.repo
    content: |
      [petasus-build-baseos]
      name=Petasus build media - BaseOS
      baseurl={{ el_repo_url }}/BaseOS
      enabled=1
      gpgcheck=0

      [petasus-build-appstream]
      name=Petasus build media - AppStream
      baseurl={{ el_repo_url }}/AppStream
      enabled=1
      gpgcheck=0
  when: el_repo_url is defined and el_repo_url | length > 0

- name: Install guest agent
  dnf:
    name: qemu-guest-agent
    state: present
    update_cache: yes
    disable_gpg_check: yes
  register: dnf_result
  until: dnf_result is succeeded
  retries: 5
  delay: 15

# Stock EL GenericCloud bases (and many migrated customer images) ship net.ifnames=0,
# forcing eth0-style NIC names. The platform addresses the default NIC by its
# predictable name (enp1s0), so strip the args from every boot entry.
- name: Remove net.ifnames/biosdevname kernel args from boot entries
  command: grubby --update-kernel=ALL --remove-args="net.ifnames biosdevname"

- name: Keep regenerated grub configs free of net.ifnames/biosdevname
  replace:
    path: /etc/default/grub
    regexp: ' ?(?:net\.ifnames|biosdevname)=[^ "]*'
    replace: ''
