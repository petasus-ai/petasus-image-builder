---
- name: Define file modes
  set_fact:
    last_log_mode:   "0644"
    machine_id_mode: "0444"

# The build-media repo (guest role) points at a build-host URL that does not
# exist at tenant runtime.
- name: Remove the build-media dnf repo
  file:
    state: absent
    path: /etc/yum.repos.d/petasus-build-media.repo

- name: Remove unused packages
  dnf:
    autoremove: yes
    lock_timeout: 60

- name: Remove yum package lists
  command: /usr/bin/yum -y clean all

- name: Gather all ifcfg-* files
  find:
    paths: /etc/sysconfig/network-scripts
    patterns: "ifcfg-*"
  register: netif_cfgs

- name: Strip out HWADDR and UUID lines
  lineinfile:
    path: "{{ item.path }}"
    regexp: '^(HWADDR|UUID)='
    state: absent
    backrefs: no
  loop: "{{ netif_cfgs.files }}"
  when: netif_cfgs.matched > 0

# Pre-existing NetworkManager keyfiles — the build's cloud-init DHCP fallback, or the
# migrated system's own profiles (anaconda/manual) — pin old NIC names, MACs, or static
# addressing. Drop them all; tenant cloud-init regenerates the config for the real NIC.
- name: Find NetworkManager connection profiles
  find:
    paths: /etc/NetworkManager/system-connections
    patterns: '*.nmconnection'
  register: ci_nm_profiles

- name: Remove NetworkManager connection profiles
  file:
    state: absent
    path: "{{ item.path }}"
  loop: "{{ ci_nm_profiles.files }}"

- name: Remove the kickstart log
  file:
    state: absent
    path: /root/anaconda-ks.cfg
