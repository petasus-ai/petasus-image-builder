---
- import_tasks: deb_prep.yml
  when: ansible_os_family == "Debian"

- import_tasks: el_prep.yml
  when: ansible_os_family == "RedHat"

- import_tasks: suse_prep.yml
  when: ansible_os_family == "Suse"

- name: Truncate machine id
  file:
    state: "{{ item.state }}"
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
  - { path: /etc/machine-id, state: absent, mode: "{{ machine_id_mode }}" }
  - { path: /etc/machine-id, state: touch,  mode: "{{ machine_id_mode }}" }

# dbus must not carry the build machine's identity either; the symlink makes every
# instance follow the per-boot /etc/machine-id. EL10 images have no /var/lib/dbus at all,
# so only fix it up where it exists.
- name: Check for the D-Bus state directory
  stat:
    path: /var/lib/dbus
  register: _dbus_dir

- name: Link the D-Bus machine id to /etc/machine-id
  file:
    src: /etc/machine-id
    dest: /var/lib/dbus/machine-id
    state: link
    force: yes
  when: _dbus_dir.stat.exists

- name: Truncate hostname file
  file:
    state: "{{ item.state }}"
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
  - { path: /etc/hostname, state: absent, mode: "0644" }
  - { path: /etc/hostname, state: touch,  mode: "0644" }

- name: Set hostname
  hostname:
    name: localhost.local
  ignore_errors: true

- name: Truncate audit logs
  file:
    state: "{{ item.state }}"
    path: "{{ item.path }}"
    owner: root
    group: utmp
    mode: "{{ item.mode }}"
  loop:
  - { path: /var/log/wtmp,    state: absent, mode: "0664" }
  - { path: /var/log/lastlog, state: absent, mode: "{{ last_log_mode }}" }
  - { path: /var/log/wtmp,    state: touch,  mode: "0664" }
  - { path: /var/log/lastlog, state: touch,  mode: "{{ last_log_mode }}" }

- name: Remove cloud-init lib dir and logs
  file:
    state: absent
    path: "{{ item }}"
  loop:
  - /var/lib/cloud
  - /var/log/cloud-init.log
  - /var/log/cloud-init-output.log
  - /var/run/cloud-init

# The build seed's ssh_pwauth wrote PasswordAuthentication yes here so packer could log in.
# Drop it so shipped images fall back to the distro sshd default; tenant cloud-init
# recreates it per VM when ssh_pwauth is requested.
- name: Remove the build-time cloud-init sshd drop-in
  file:
    state: absent
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf

- name: Find SSH host keys
  find:
    path: /etc/ssh
    pattern: 'ssh_host_*'
  register: ssh_host_keys

- name: Remove SSH host keys
  file:
    state: absent
    path: "{{ item.path }}"
  loop: "{{ ssh_host_keys.files }}"

- name: Remove SSH authorized users
  file:
    state: absent
    path: "{{ item.path }}"
  loop:
  - { path: /root/.ssh/authorized_keys }
  - { path: "/home/{{ ansible_env.SUDO_USER }}/.ssh/authorized_keys" }

- name: Remove and recreate /var/log
  file:
    state: "{{ item.state }}"
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: 0755
  loop:
  - { path: /var/log, state: absent }
  - { path: /var/log, state: directory }

# auditd does not create its log dir at startup (exits NOTCONFIGURED), so restore it
# after the /var/log wipe on every family; el_end.yml relabels it on SELinux systems.
- name: Create audit log directory
  file:
    path: /var/log/audit
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Clean /tmp and /var/tmp
  shell: find /tmp /var/tmp -xdev -mindepth 1 -delete
  changed_when: false
  failed_when: false

- import_tasks: el_end.yml
  when: ansible_os_family == "RedHat"

- name: Truncate shell history
  file:
    state: absent
    path: "{{ item.path }}"
  loop:
  - { path: /root/.bash_history }
  - { path: "/home/{{ ansible_env.SUDO_USER }}/.bash_history" }

