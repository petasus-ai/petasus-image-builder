---
- name: Define file modes
  set_fact:
    last_log_mode:   "0664"
    machine_id_mode: "0644"

- name: Remove apt package caches
  apt:
    autoclean: yes
    autoremove: yes
    force_apt_get: yes

- name: Remove apt package lists
  file:
    state: "{{ item.state }}"
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
  - { path: /var/lib/apt/lists, state: absent,    mode: "0755" }
  - { path: /var/lib/apt/lists, state: directory, mode: "0755" }

- name: Disable apt-daily services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
  - apt-daily
  - apt-daily.timer
  - apt-daily-upgrade
  - apt-daily-upgrade.timer

- name: Get installed packages
  package_facts:

- name: Disable unattended upgrades if installed
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: false
  when: "'unattended-upgrades' in ansible_facts.packages"

- name: Reset network interface IDs
  file:
    state: absent
    path: /etc/udev/rules.d/70-persistent-net.rules

# Pre-existing netplan configs — the build's 50-cloud-init.yaml, or the migrated
# system's own (subiquity's 00-installer-config.yaml, manual files) — pin old NIC
# names or static addressing. Drop them all; tenant cloud-init regenerates the
# config for the real NIC.
- name: Find netplan configs
  find:
    paths: /etc/netplan
    patterns: '*.yaml'
  register: ci_netplan

- name: Remove netplan configs
  file:
    state: absent
    path: "{{ item.path }}"
  loop: "{{ ci_netplan.files }}"
